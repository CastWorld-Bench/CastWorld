name: CastWorld project site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_project_site.py'
      - 'tests/test_project_site.py'
      - 'docs/data/dataset_inventory.csv'
      - 'docs/assets/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: castworld-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated views
        run: python tools/build_project_site.py --check
      - name: Test public result views
        run: python -m unittest discover -s tests -p test_project_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
