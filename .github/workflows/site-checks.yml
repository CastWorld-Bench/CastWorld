name: Validate CastWorld project site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_project_site.py'
      - 'tests/test_project_site.py'
      - 'docs/data/dataset_inventory.csv'
      - 'docs/assets/**'
      - 'README.md'
      - '.github/workflows/site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: castworld-site-checks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated views
        run: python tools/build_project_site.py --check
      - name: Test public result views
        run: python -m unittest discover -s tests -p test_project_site.py
