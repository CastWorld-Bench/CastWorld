[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "castbench"
version = "0.1.0"
description = "Sample-scoped, tool-interactive time-series agent benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "pydantic>=2.10,<3", "httpx[socks]>=0.27,<1", "statsmodels>=0.14,<1", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
data = ["datasets>=3.6,<4", "pyarrow>=18,<21", "gluonts>=0.16,<0.17", "numpy>=1.26,<2.2"]
test = ["pytest>=8", "ruff>=0.12", "jsonschema>=4.23,<5"]

[project.scripts]
castbench = "castbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
